name: Update Stock PR Data

on:
  schedule:
    # 每天北京时间早上 06:30 (UTC 22:30，周一至周五) 自动运行
    - cron: '30 22 * * 1-5'
  workflow_dispatch: # 允许在 GitHub 网页上手动点击运行

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch and calculate PR
        run: |
          python fetch_pr.py

      - name: Commit and push if data changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: update stock PR data [$(date '+%Y-%m-%d %H:%M')]" && git push)
